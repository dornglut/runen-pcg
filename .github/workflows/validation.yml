name: RunenPCG Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runen-pcg-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RunenPCG
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@718f53a5601f4fc89d8a8b1deab89550d36b70a9
